<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE RUNNER — 表示確認</title><style>body{margin:0;background:#1c2633;color:#ddf3ff;font:14px system-ui}nav{padding:12px;display:flex;gap:8px;position:sticky;top:0;z-index:2;background:#1c2633}button,a{padding:12px;background:#344e66;border:0;border-radius:4px;color:#e9faff;font:inherit}iframe{display:block;border:0;margin:16px auto;background:#091225}main{overflow:auto}</style><nav aria-label="表示サイズ"><button data-size="390,844">スマホ縦</button><button data-size="844,390">スマホ横</button><button data-size="1024,768">タブレット</button><button data-size="1280,720">PC</button><a href="./">ゲームを開く</a></nav><main><iframe title="ゲームプレビュー" src="./" width="1024" height="768" allow="fullscreen; autoplay; gamepad"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;});</script></html>
